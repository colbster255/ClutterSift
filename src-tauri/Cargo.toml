[package]
name = "cluttersift"
version = "0.1.0"
description = "Privacy-first Windows storage analysis and cleanup review"
authors = ["ClutterSift contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "cluttersift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
globset = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native"] }
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
